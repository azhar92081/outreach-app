<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutreachAI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0D14; color: #E2E8F0; }
        .input-dark { background-color: #0A0D14; border: 1px solid #1E2433; color: white; transition: all 0.2s; }
        .input-dark:focus { border-color: #3B82F6; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md text-center mb-8">
        <h1 class="text-4xl font-extrabold tracking-tight mb-2 text-white">Outreach<span class="text-blue-500">AI</span></h1>
        <p class="text-slate-400">Sign in to your campaign dashboard</p>
    </div>

    <div class="w-full max-w-md bg-[#12151E] border border-[#1E2433] rounded-2xl relative overflow-hidden shadow-2xl p-8">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-600 to-emerald-400"></div>

        {% if error %}
        <div class="mb-6 p-3 bg-red-900/30 border border-red-500/50 rounded-lg text-red-400 text-sm font-medium text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">Username</label>
                <input type="text" name="username" required class="input-dark w-full rounded-xl py-3 px-4 text-sm" placeholder="Enter username">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">Password</label>
                <input type="password" name="password" required class="input-dark w-full rounded-xl py-3 px-4 text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors mt-2">
                Sign In
            </button>
        </form>
    </div>

    <p class="mt-8 text-slate-500 text-sm max-w-xs text-center leading-relaxed">
        No account? Ask whoever deployed this tool to run <code class="bg-[#12151E] px-1.5 py-0.5 rounded text-slate-400 border border-[#1E2433] font-mono text-xs">create_user.py</code> for you.
    </p>

</body>
</html>
